name: release

# A tag v* builds the setup program, runs the tests and attaches OpenInNvim-Setup.exe and SHA256SUMS.txt
# to a DRAFT release: nothing is public until the draft is published by hand.
# Not signed: the release notes tell users to compare the checksum (see docs/installation.md).

on:
  push:
    tags:
      - 'v*'
  # A manual run builds and tests only (no release): to try the workflow without a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ('v' + $v -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match VERSION $v" }

      - name: Install Neovim for the tests
        shell: powershell
        run: |
          choco install neovim --no-progress -y
          # The package unpacks to C:\tools\neovim\nvim-win64 (not Program Files); the tests read NVIM_EXE.
          $nvim = Get-ChildItem 'C:\tools\neovim' -Recurse -Filter nvim.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $nvim) { throw 'nvim.exe not found under C:\tools\neovim' }
          "NVIM_EXE=$nvim" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $nvim --version | Select-Object -First 1

      - name: Tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1

      - name: Build the setup
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build-setup.ps1

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' dist\OpenInNvim-Setup.exe dist\SHA256SUMS.txt --draft --title '${{ github.ref_name }}' --notes 'Windows setup (per user, no administrator rights). Not code-signed: Windows SmartScreen may warn; compare the SHA-256 in SHA256SUMS.txt.'
