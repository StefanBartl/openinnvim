# open-in-nvim.ini - configuration of OpenInNvim.exe (lives next to the exe).
# Every key is optional; KEY = value, "#" starts a comment line, %VAR% in a value is expanded.
# See docs/configuration.md.

# Path of nvim.exe. Without it "nvim" is looked up on PATH.
NVIM_BIN = C:\Program Files\Neovim\bin\nvim.exe

# Where a NEW instance is shown: auto (WezTerm, then Windows Terminal, then a plain console),
# wezterm, wt or console.
TERMINAL = auto

# wezterm-gui.exe, when it is not on PATH.
# WEZTERM_BIN = C:\Program Files\WezTerm\wezterm-gui.exe

# A fixed server tried first by "current instance": a pipe name or host:port.
# Empty: the running instances are found by themselves.
# NVIM_SERVER =

# The instance that owns \\.\pipe\nvim-%USERNAME% (if your init.lua calls serverstart() with that
# name) goes first. false: all running instances are treated alike.
PREFER_STABLE_PIPE = true

# Which running instance gets the file when there are several:
#   newest = the most recently started, oldest = the longest running, ask = a chooser window.
INSTANCE_PICK = newest

# What a folder does in "current instance":
#   filetree = :Filetree open <dir> when the instance has filetree.nvim, edit = cd + directory view.
FOLDER_OPENS_IN = filetree

# true: after opening, bring the window that hosts the instance to the front (best effort).
FOCUS_TERMINAL = false
